name: Build desktop installers
on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck && npm run lint -- --max-warnings 0
      - run: node scripts/safe-fetch-test.mjs && node src/lib/observability/redact.test.mjs && node scripts/local-mode-test.mjs
      - run: npm run desktop:build && node scripts/local-production-smoke.mjs
        env:
          OPENMAN_LOCAL_MODE: '1'
      - run: node scripts/local-production-smoke.mjs
        env:
          OPENMAN_SMOKE_DEFAULT: '1'
  installers:
    if: github.event_name != 'pull_request'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, platform: win, arch: x64 }
          - { os: windows-11-arm, platform: win, arch: arm64 }
          - { os: windows-2022, platform: win, arch: ia32 }
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          - { os: macos-14, platform: mac, arch: universal }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: matrix.arch == 'ia32'
        run: npm rebuild node-pty
        env:
          npm_config_arch: ia32
          npm_config_build_from_source: 'true'
      - if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm run desktop:build
        env:
          OPENMAN_LOCAL_MODE: '1'
      - run: npx electron-builder --config electron-builder.yml --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.msi
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.dmg
            release/*.pkg
            release/*.zip
          if-no-files-found: error
          retention-days: 14
